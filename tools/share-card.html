<!doctype html>
<!-- The link-preview image (WhatsApp, iMessage, socials): a 1200×630 cut of the cover.
     Render: zsh tools/share-card.sh  →  site/assets/share.jpg -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,900&family=Inter+Tight:wght@600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0B0B0B; }
  .spread { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; }
  .page { position: relative; overflow: hidden; }
  .l { background: #F5F3EE; color: #141414; }
  .r { background: #141414; }
  .label { font-family: 'IBM Plex Mono', monospace; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; }
  .folio { position: absolute; top: 30px; left: 36px; color: #8A867E; }
  .mail { position: absolute; top: 54px; left: 36px; border-bottom: 1.5px solid #141414; padding-bottom: 2px; }
  .silhouette { position: absolute; right: 40px; bottom: 300px; height: 300px; }
  .band { position: absolute; left: 36px; right: 36px; bottom: 0; height: 290px; overflow: hidden; }
  .giant { position: absolute; left: 0; bottom: 0; margin: 0; font-family: 'Archivo', sans-serif; font-weight: 900; font-stretch: 62%;
           text-transform: uppercase; font-size: 196px; line-height: .74; letter-spacing: .005em; }
  .giant span { display: block; height: .74em; overflow: hidden; white-space: nowrap; }
  .giant span + span { border-top: .022em solid #F5F3EE; }
  .credit { position: absolute; left: 36px; bottom: 304px; font-weight: 500; }
  .r img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
  .r::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0) 40%); }
  .issue { position: absolute; z-index: 1; left: 32px; right: 32px; bottom: 28px; color: #fff; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
  .issue span { white-space: nowrap; }
  .issue b { white-space: nowrap; font-family: 'Inter Tight', sans-serif; font-weight: 600; letter-spacing: -.045em; font-size: 46px; line-height: 1; }
  .gutter { position: absolute; top: 0; bottom: 0; left: 600px; width: 24px; transform: translateX(-24px); background: linear-gradient(to right, rgba(0,0,0,0), rgba(0,0,0,.12)); }
</style>
</head>
<body>
<div class="spread">
  <div class="page l">
    <span class="label folio">Jinko Joshu — Issue Nº01</span>
    <span class="label mail">jinkojoshu.eu</span>
    <img class="silhouette" src="../site/assets/mag/halftone-portrait.png" alt="">
    <span class="label credit">Performer · Amsterdam</span>
    <div class="band"><h1 class="giant"><span>Jinko</span><span>Joshu</span></h1></div>
    <div class="gutter"></div>
  </div>
  <div class="page r">
    <img src="../site/assets/poster/reel.jpg" alt="">
    <div class="issue"><b>Magazine Nº01</b><span class="label">Commercials · Dance · Styling</span></div>
  </div>
</div>
</body>
</html>
